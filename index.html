<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGNREGS · Annexure B</title>

  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#1a7f64">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Annexure B">
  
  <!-- Inline SVG App Icon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a7f64'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='50' fill='white'>📄</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a7f64'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='50' fill='white'>📄</text></svg>">

  <!-- Embedded Web App Manifest via Data URI -->
  <link rel="manifest" href="data:application/manifest+json;utf8,%7B%22name%22%3A%22MGNREGS%20Annexure%20B%22%2C%22short_name%22%3A%22Annexure%20B%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f0f4f9%22%2C%22theme_color%22%3A%22%231a7f64%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2720%27%20fill%3D%27%231a7f64%27%2F%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2755%25%27%20dominant-baseline%3D%27middle%27%20text-anchor%3D%27middle%27%20font-size%3D%2750%27%20fill%3D%27white%27%3E%F0%9F%93%84%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f0f4f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 2rem 1rem;
      color: #0b1a2f;
      line-height: 1.5;
    }

    /* Card */
    .form-card {
      max-width: 880px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 28px;
      padding: 2.2rem 2.5rem;
      box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.20), 0 8px 24px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .form-heading {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0a1e32;
      border-bottom: 3px solid #1a7f64;
      padding-bottom: 0.6rem;
      margin-bottom: 1.6rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .form-heading small {
      font-size: 1rem;
      font-weight: 400;
      color: #3e5e7a;
      margin-left: auto;
      background: #eef3f8;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      letter-spacing: 0.3px;
    }

    .section-header {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #1a6d5e;
      border-bottom: 1.5px solid #dce5ef;
      padding-bottom: 0.4rem;
      margin-top: 2rem;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
    }
    .section-header span {
      background: #e3f0ec;
      padding: 0.1rem 0.7rem;
      border-radius: 20px;
      font-size: 0.7rem;
      margin-left: 0.7rem;
      color: #0f4d41;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem 1.8rem;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem 1.5rem;
    }
    .grid-full {
      grid-column: 1 / -1;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .field label {
      font-weight: 500;
      font-size: 0.82rem;
      color: #1c3b54;
      letter-spacing: 0.02em;
    }
    .field label .optional {
      font-weight: 400;
      color: #6e7e92;
      font-size: 0.7rem;
      margin-left: 0.2rem;
    }

    .field input,
    .field select,
    .field textarea {
      background: #f8fafc;
      border: 1px solid #d8e0e9;
      border-radius: 14px;
      padding: 0.65rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      transition: 0.2s;
      width: 100%;
      color: #0a1a2a;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: #1a7f64;
      box-shadow: 0 0 0 3px rgba(26, 127, 100, 0.15);
      background: #ffffff;
    }
    .field textarea {
      resize: vertical;
      min-height: 60px;
    }

    .land-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem 0.8rem;
      background: #f6fafc;
      padding: 0.6rem 1rem 0.8rem 1rem;
      border-radius: 20px;
      border: 1px solid #e2ebf3;
    }
    .land-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex: 1 1 100px;
    }
    .land-item input {
      background: white;
      border: 1px solid #d0dbe8;
      border-radius: 40px;
      padding: 0.5rem 0.8rem;
      width: 80px;
      font-size: 0.95rem;
      text-align: center;
    }
    .land-item span {
      font-size: 0.8rem;
      color: #2c4b66;
      font-weight: 500;
    }
    .land-result {
      background: #e1f0ea;
      border-radius: 40px;
      padding: 0.4rem 1.2rem;
      font-weight: 600;
      color: #0b4d3b;
      font-size: 0.95rem;
      flex: 1 1 160px;
      border: 1px solid #b5d3ca;
      text-align: center;
    }
    .equal-sign {
      font-weight: 600;
      color: #3f5a72;
      padding: 0 0.2rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 2.4rem;
      padding-top: 1.2rem;
      border-top: 1px solid #dfe8f2;
    }
    .btn-main {
      border: none;
      background: #1b4f7a;
      color: white;
      padding: 0.85rem 1.6rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: 100%;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 8px -4px rgba(27, 79, 122, 0.3);
      transition: 0.2s;
    }
    .btn-main:hover {
      background: #123d5f;
    }

    /* PWA Install Button */
    #pwaInstallBtn {
      display: none;
      background: #1a7f64;
      color: white;
      border: none;
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      margin-left: 0.5rem;
    }

    /* In-App Preview Overlay (Crucial for installed PWAs) */
    #previewOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #525659;
      z-index: 9999;
      overflow-y: auto;
    }
    .action-bar {
      position: sticky;
      top: 0;
      background: #1a2633;
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 10000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      flex-wrap: wrap;
    }
    .btn-preview {
      padding: 9px 22px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-copy { background: #1a7f64; color: white; }
    .btn-print { background: #2a9d8f; color: white; }
    .btn-close { background: #c44545; color: white; }
    .btn-preview:hover { opacity: 0.9; transform: scale(0.98); }

    .a4-page {
      width: 210mm;
      max-width: 95vw;
      min-height: 297mm;
      margin: 20px auto;
      background: #fff;
      padding: 20mm;
      box-shadow: 0 0 12px rgba(0,0,0,0.3);
    }
    .doc-content { font-size: 14px; line-height: 1.6; max-width: 680px; margin: auto; }
    .doc-content hr { border: 0; border-top: 1px solid #222; margin: 14px 0; }

    @media print {
      body * { visibility: hidden !important; }
      #previewOverlay, #previewOverlay * { visibility: visible !important; }
      #previewOverlay { position: absolute; left: 0; top: 0; background: #fff !important; }
      .action-bar { display: none !important; }
      .a4-page { width: 100% !important; margin: 0 !important; padding: 0 !important; box-shadow: none !important; }
    }

    @media (max-width: 680px) {
      .form-card { padding: 1.5rem 1rem; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; gap: 0.8rem; }
      .land-group { flex-direction: column; align-items: stretch; }
      .land-item input { width: 100%; }
      .a4-page { padding: 15px; }
    }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="form-heading">
      Annexure B · Entry
      <button id="pwaInstallBtn" type="button">⬇️ Install App</button>
      <small>Viksit Bharat</small>
    </div>

    <form id="annexureForm" novalidate>
      <!-- Location -->
      <div class="section-header">📍 Location <span>GP / Block / District</span></div>
      <div class="grid-2">
        <div class="field">
          <label for="panchayath">Grama Panchayath</label>
          <input type="text" id="panchayath" value="Triprangode" required>
        </div>
        <div class="field">
          <label for="block">Block</label>
          <input type="text" id="block" value="Tirur" required>
        </div>
        <div class="field">
          <label for="district">District</label>
          <input type="text" id="district" value="Malappuram" required>
        </div>
        <div class="field">
          <label for="state">State</label>
          <input type="text" id="state" value="Kerala" required>
        </div>
      </div>

      <!-- Resolution -->
      <div class="section-header">📄 Resolution <span>Sl. No · Page · Date</span></div>
      <div class="grid-3">
        <div class="field">
          <label for="res">1. Sl No. of Resolution</label>
          <input type="text" id="res" required>
        </div>
        <div class="field">
          <label for="page">2. Page No.</label>
          <input type="text" id="page" required>
        </div>
        <div class="field">
          <label for="date">3. Date of Resolution</label>
          <input type="date" id="date" required>
        </div>
      </div>

      <!-- Proposed Work -->
      <div class="section-header">🛠️ Work & Beneficiary</div>
      <div class="grid-2">
        <div class="field">
          <label for="type">4. Type of Beneficiary</label>
          <select id="type" required>
            <option value="SC" selected>SC</option>
            <option value="ST">ST</option>
            <option value="Nomadic Tribes">Nomadic Tribes</option>
            <option value="Below Poverty Line (BPL)">Below Poverty Line (BPL)</option>
            <option value="Women-headed Household">Women-headed Household</option>
            <option value="Small / Marginal Farmer">Small / Marginal Farmer</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="work">5. Type of Work</label>
          <select id="work" required>
            <option value="Construction of toilet for individual houses" selected>Construction of toilet for individual houses</option>
            <option value="Construction of Dug Well / Open Well">Construction of Dug Well / Open Well</option>
            <option value="Construction of Cattle Shed">Construction of Cattle Shed</option>
            <option value="Construction of Goat Shed">Construction of Goat Shed</option>
            <option value="Construction of Poultry Shed">Construction of Poultry Shed</option>
            <option value="Construction of Compost Pit / Vermicompost">Construction of Compost Pit / Vermicompost</option>
            <option value="Construction of Soak Pit">Construction of Soak Pit</option>
            <option value="Land Development / Fodder Cultivation">Land Development / Fodder Cultivation</option>
            <option value="Plantation / Horticulture Works">Plantation / Horticulture Works</option>
            <option value="Other Individual Works">Other Individual Works</option>
          </select>
        </div>
        <div class="field">
          <label for="name">6a. Beneficiary Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="field">
          <label for="job">6b. Job Card No.</label>
          <input type="text" id="job" required>
        </div>
      </div>

      <!-- Land holding -->
      <div class="field grid-full" style="margin-top: 0.5rem;">
        <label>7. Total Land Holding <span class="optional">(Ares &amp; Sq. M → Cent)</span></label>
        <div class="land-group">
          <div class="land-item">
            <input type="number" step="any" min="0" id="land_ares" placeholder="0" oninput="calculateCent()">
            <span>Ares</span>
          </div>
          <div class="land-item">
            <input type="number" step="any" min="0" id="land_sqm" placeholder="0" oninput="calculateCent()">
            <span>Sq. M</span>
          </div>
          <span class="equal-sign">=</span>
          <div class="land-result" id="calculated_cent">0 Cent (0.00 acre)</div>
        </div>
      </div>

      <!-- Khata & Prior assets -->
      <div class="grid-2" style="margin-top: 0.4rem;">
        <div class="field">
          <label for="khata">8. Khata / Khasra No.</label>
          <input type="text" id="khata" required>
        </div>
        <div class="field">
          <label for="asset">9. Prior MGNREGA Assets Received</label>
          <textarea id="asset" rows="2">Nil</textarea>
        </div>
      </div>

      <!-- Submit / Open Preview -->
      <div class="actions">
        <button type="button" class="btn-main" onclick="openInAppPreview()">Next → Open Preview</button>
      </div>
    </form>
  </div>

  <!-- In-App Preview Overlay -->
  <div id="previewOverlay">
    <div class="action-bar">
      <button class="btn-preview btn-copy" id="previewCopyBtn" onclick="copyDocumentText()">📋 Copy for Word/KSMART</button>
      <button class="btn-preview btn-print" onclick="window.print()">🖨️ Print</button>
      <button class="btn-preview btn-close" onclick="closeInAppPreview()">Close</button>
    </div>
    <div class="a4-page">
      <div id="previewRenderBody"></div>
    </div>
  </div>

  <script>
    // --- PWA Installation & Service Worker Registration ---
    let deferredPrompt;
    const installBtn = document.getElementById('pwaInstallBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    // Register an offline Cache-first Service Worker via Blob
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'annexure-b-v1';
          self.addEventListener('install', (e) => {
            self.skipWaiting();
          });
          self.addEventListener('activate', (e) => {
            e.waitUntil(clients.claim());
          });
          self.addEventListener('fetch', (e) => {
            e.respondWith(
              caches.match(e.request).then((res) => res || fetch(e.request).catch(() => caches.match(e.request)))
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.error);
      });
    }

    // --- Calculation & Date Formatter ---
    function calculateCent() {
      const ares = parseFloat(document.getElementById('land_ares').value) || 0;
      const sqm = parseFloat(document.getElementById('land_sqm').value) || 0;
      const totalSqMeters = (ares * 100) + sqm;
      const cent = totalSqMeters / 40.4686;
      const acre = cent / 100;
      const resultText = (cent > 0) ? `${cent.toFixed(2)} Cent (${acre.toFixed(2)} acre)` : "0 Cent (0.00 acre)";
      document.getElementById('calculated_cent').textContent = resultText;
      return resultText;
    }

    function formatDisplayDate(dateString) {
      if (!dateString) return "";
      const parts = dateString.split('-');
      return (parts.length === 3) ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateString;
    }

    function buildDocumentHTML() {
      const p = document.getElementById('panchayath').value;
      const b = document.getElementById('block').value;
      const d = document.getElementById('district').value;
      const s = document.getElementById('state').value;
      const res = document.getElementById('res').value;
      const page = document.getElementById('page').value;
      const dt = formatDisplayDate(document.getElementById('date').value);
      const type = document.getElementById('type').value;
      const work = document.getElementById('work').value;
      const name = document.getElementById('name').value;
      const job = document.getElementById('job').value;
      const land = calculateCent();
      const khata = document.getElementById('khata').value;
      const asset = document.getElementById('asset').value;

      return `
<div class="doc-content" id="docContentCopyTarget">
  <p style="text-align:center; font-weight:700; font-size:16px; margin:0 0 2px 0;">Annexure B</p>
  <p style="text-align:center; font-weight:600; font-size:14px; margin:0 0 10px 0;">Undertaking for Individual Beneficiary Works under Viksit Bharat – Guarantee for Rozgar &amp; Ajeevika Mission (Gramin)</p>
  <hr>
  <p style="margin:4px 0;">Grama Panchayath: ${p}<br>Block: <strong>${b}</strong><br>District: <strong>${d}</strong><br>State: <strong>${s}</strong></p>
  <hr>
  <p style="text-align:center; font-weight:700; text-decoration:underline; margin:10px 0 4px 0;">Details of Grama Sabha Resolution:</p>
  <hr>
  <p style="margin:4px 0;">1. Sl No. of Resolution: <strong>${res}</strong><br>2. Page No.: <strong>${page}</strong><br>3. Date of Resolution: <strong>${dt}</strong></p>
  <hr>
  <p style="text-align:center; font-weight:700; text-decoration:underline; margin:10px 0 4px 0;">Details of the Proposed Work</p>
  <hr>
  <p style="margin:4px 0;">4. Type of Beneficiary (as per Para 5, Schedule I of Act): <strong>${type}</strong><br>5. Type of Work: <strong>${work}</strong><br>6. Name &amp; Job Card (If Individual): <strong>${name} / ${job}</strong><br>7. Total Land Holding (In Acres / Cent): <strong>${land}</strong><br>8. Khata / Khasra No.: <strong>${khata}</strong><br>9. Has the household received any individual asset under VB-G RAM G before: <strong>${asset}</strong></p>
  <hr>
  <p style="text-align:center; font-weight:700; font-size:14px; margin:16px 0 6px 0;">Certificate</p>
  <p style="text-align:justify; margin:0 0 12px 0;">This is to certify that the above-mentioned individual beneficiary work, approved by the Grama Sabha and recorded in its resolution as detailed above, has been physically verified for feasibility by the Grama Panchayath. It is certified that the beneficiary is eligible as per Para 5 of Schedule I of the Act. Accordingly, the work is recommended under the Viksit Bharat – Guarantee for Rozgar &amp; Ajeevika Mission (G) (VB-G RAM G).</p>
  <p style="text-align:right; margin-top:32px;"><strong>Panchayath Secretary</strong></p>
</div>`;
    }

    // --- Preview and Clipboard Logic ---
    function openInAppPreview() {
      const form = document.getElementById('annexureForm');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }
      document.getElementById('previewRenderBody').innerHTML = buildDocumentHTML();
      document.getElementById('previewOverlay').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function closeInAppPreview() {
      document.getElementById('previewOverlay').style.display = 'none';
    }

    function copyDocumentText() {
      const target = document.getElementById('docContentCopyTarget');
      const range = document.createRange();
      range.selectNodeContents(target);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      try {
        document.execCommand('copy');
        const btn = document.getElementById('previewCopyBtn');
        const original = btn.textContent;
        btn.textContent = "✅ Copied!";
        setTimeout(() => { btn.textContent = original; }, 2000);
      } catch (err) {
        alert("Failed to copy automatically. Please select text manually.");
      } finally {
        sel.removeAllRanges();
      }
    }

    window.addEventListener('DOMContentLoaded', calculateCent);
  </script>
</body>
</html>
