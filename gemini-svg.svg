<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4f7a" />
      <stop offset="50%" stop-color="#1a7f64" />
      <stop offset="100%" stop-color="#0f5442" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eaf1f7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Glow / Accent Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6" />

  <!-- Document Sheet -->
  <g filter="url(#shadow)">
    <!-- Main Paper Page -->
    <path d="M 148 100 
             L 296 100 
             L 364 168 
             L 364 412 
             A 20 20 0 0 1 344 432 
             L 168 432 
             A 20 20 0 0 1 148 412 Z" 
          fill="url(#sheetGrad)" />

    <!-- Folded Corner Accent -->
    <path d="M 296 100 L 296 156 A 12 12 0 0 0 308 168 L 364 168 Z" fill="#c3d5e4" />

    <!-- Content Lines inside Document -->
    <rect x="184" y="194" width="90" height="14" rx="7" fill="#1a7f64" />
    <rect x="184" y="226" width="144" height="10" rx="5" fill="#8da3b8" />
    <rect x="184" y="252" width="144" height="10" rx="5" fill="#8da3b8" />
    <rect x="184" y="278" width="110" height="10" rx="5" fill="#8da3b8" />
    <rect x="184" y="304" width="130" height="10" rx="5" fill="#8da3b8" />
  </g>

  <!-- Circular Badge with Checkmark -->
  <g filter="url(#shadow)">
    <circle cx="356" cy="360" r="54" fill="#1a7f64" stroke="#ffffff" stroke-width="8" />
    <path d="M 334 360 L 350 376 L 382 342" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
